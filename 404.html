<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page not found</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#06060a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #7c5cff;
      --accent-2: #22d3ee;
      --pink: #ff5c9e;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 30px;
      text-align: center;
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      color: #f2f2f7;
      background:
        radial-gradient(900px 600px at 85% -10%, rgba(124, 92, 255, 0.2), transparent 60%),
        radial-gradient(800px 500px at -10% 110%, rgba(34, 211, 238, 0.14), transparent 60%),
        #06060a;
      overflow: hidden;
    }

    .code {
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
      font-size: clamp(6rem, 22vw, 12rem);
      font-weight: 600;
      letter-spacing: -0.05em;
      line-height: 1;
      background: linear-gradient(120deg, var(--accent), var(--accent-2) 60%, var(--pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: float 5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-12px); }
    }

    h1 {
      font-family: "Space Grotesk", "Segoe UI", sans-serif;
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 18px 0 10px;
    }

    p {
      color: #a0a0b4;
      max-width: 46ch;
      margin: 0 auto 28px;
      font-size: 0.98rem;
    }

    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 0.92rem;
      text-decoration: none;
      color: #08080d;
      background: linear-gradient(120deg, var(--accent), var(--accent-2) 60%, var(--pink));
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease;
      box-shadow: 0 12px 34px -14px var(--accent);
    }

    a.btn:hover { transform: translateY(-2px); }

    a.btn.ghost {
      background: rgba(255, 255, 255, 0.05);
      color: #f2f2f7;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: none;
    }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>This page drifted off.</h1>
    <p>
      The link may be broken, or the page you're looking for isn't part of this portfolio.
    </p>
    <div class="actions">
      <a class="btn" id="home" href="./index.html">Back to the portfolio</a>
      <a class="btn ghost" id="work" href="./index.html#work">See my work</a>
    </div>
  </main>

  <script>
    /* GitHub Pages serves this file for any missing URL, which can sit at any
       depth under the repository path. Probe upward until the real index.html
       is found so the buttons always point at the actual site. */
    (function () {
      var parts = window.location.pathname.split("/").filter(Boolean);
      var bases = [];
      for (var depth = parts.length; depth >= 0; depth--) {
        bases.push("/" + parts.slice(0, depth).join("/"));
      }

      function probe(base) {
        return fetch(base + "/", { method: "HEAD" }).then(function (res) {
          return res.ok ? base + "/" : null;
        }).catch(function () { return null; });
      }

      bases.reduce(function (chain, base) {
        return chain.then(function (found) {
          return found ? found : probe(base);
        });
      }, Promise.resolve(null)).then(function (found) {
        if (!found) return;
        document.getElementById("home").href = found;
        document.getElementById("work").href = found + "#work";
      });
    })();
  </script>
</body>
</html>
